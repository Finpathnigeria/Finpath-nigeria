<!DOCTYPE html>
<html lang="en-NG">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>

  <!-- Primary Meta -->
  <title>FinPath Nigeria — Civil Servant Finance Platform</title>
  <meta name="description" content="Nigeria's first financial platform built exclusively for civil and public servants. Invest in T-Bills, poultry, catfish farming, land, and more. Plan your budget. Build generational wealth."/>
  <meta name="author" content="FinPath Nigeria"/>
  <meta name="keywords" content="Nigerian investment, civil servant finance, FGN T-Bills, catfish farming, poultry investment, NHF mortgage, NGX stocks, financial planning Nigeria"/>

  <!-- PWA -->
  <meta name="theme-color" content="#0B3D2E"/>
  <meta name="background-color" content="#0B3D2E"/>
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="application-name" content="FinPath"/>

  <!-- Apple PWA (iOS) -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="FinPath"/>
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-192x192.png"/>
  <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/icons/icon-152x152.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icons/icon-192x192.png"/>

  <!-- Apple Splash Screens (iPhone sizes) -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="%PUBLIC_URL%/splash/splash-1170x2532.png"/>
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="%PUBLIC_URL%/splash/splash-1125x2436.png"/>
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="%PUBLIC_URL%/splash/splash-828x1792.png"/>

  <!-- Windows Tiles -->
  <meta name="msapplication-TileColor" content="#0B3D2E"/>
  <meta name="msapplication-TileImage" content="%PUBLIC_URL%/icons/icon-144x144.png"/>
  <meta name="msapplication-config" content="%PUBLIC_URL%/browserconfig.xml"/>

  <!-- Open Graph (social sharing) -->
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://finpathnigeria.com/"/>
  <meta property="og:title" content="FinPath Nigeria — Grow Your Wealth Beyond Your Salary"/>
  <meta property="og:description" content="Nigeria's first financial platform for civil servants. 35+ investments, AI advisor, budget tools, and financial literacy — all in one app."/>
  <meta property="og:image" content="%PUBLIC_URL%/og-image.png"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta property="og:locale" content="en_NG"/>

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:site" content="@FinPathNigeria"/>
  <meta name="twitter:title" content="FinPath Nigeria — Civil Servant Finance Platform"/>
  <meta name="twitter:description" content="35+ investment options, AI advisor, PAYE calculator, retirement projector — built for Nigerian civil servants."/>
  <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png"/>

  <!-- Favicon set -->
  <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icons/favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/icons/favicon-16x16.png"/>
  <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico"/>

  <!-- Preload critical fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap"/>

  <style>
    /* Critical CSS — prevents flash of unstyled content */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'DM Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0B3D2E;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior: none;
      /* Safe area insets for notched iPhones */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    #root {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    /* Splash / loading state */
    #splash {
      position: fixed;
      inset: 0;
      background: #0B3D2E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-logo { font-size: 36px; font-weight: 800; color: white; font-family: 'Playfair Display', serif; }
    .splash-logo span { color: #F0B429; }
    .splash-sub { font-size: 10px; color: #2ECC8A; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; margin-bottom: 32px; }
    .splash-dots { display: flex; gap: 8px; }
    .splash-dot { width: 8px; height: 8px; background: rgba(255,255,255,0.3); border-radius: 50%; animation: splashBounce 1.2s infinite; }
    .splash-dot:nth-child(2) { animation-delay: 0.2s; }
    .splash-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes splashBounce { 0%,80%,100%{transform:translateY(0);background:rgba(255,255,255,0.3)} 40%{transform:translateY(-8px);background:rgba(255,255,255,0.9)} }
  </style>
</head>
<body>
  <!-- Loading splash screen -->
  <div id="splash">
    <div class="splash-logo">FinPath<span>.</span></div>
    <div class="splash-sub">Nigeria</div>
    <div class="splash-dots">
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
    </div>
  </div>

  <!-- React app mounts here -->
  <div id="root"></div>

  <noscript>
    <div style="padding:40px;text-align:center;background:#0B3D2E;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;">
      <div>
        <h1 style="font-size:24px;margin-bottom:12px;">FinPath Nigeria</h1>
        <p>Please enable JavaScript to use FinPath Nigeria.</p>
      </div>
    </div>
  </noscript>

  <script>
    // Hide splash once React loads
    window.__hideSplash = function() {
      var s = document.getElementById('splash');
      if (s) { s.classList.add('hidden'); setTimeout(function(){ s.remove(); }, 500); }
    };
  </script>
</body>
</html>
