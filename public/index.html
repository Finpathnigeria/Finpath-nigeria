<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B3D2E" />
    <meta name="description" content="FinPath Nigeria — Financial platform for Nigerian civil and public servants" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinPath" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-192x192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <title>FinPath Nigeria</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        background: #0B3D2E;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease;
        font-family: 'DM Sans', sans-serif;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      .splash-logo { font-size: 34px; font-weight: 800; color: white; font-family: Georgia, serif; }
      .splash-logo span { color: #F0B429; }
      .splash-sub { font-size: 10px; color: #2ECC8A; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; margin-bottom: 28px; }
      .splash-dots { display: flex; gap: 8px; }
      .splash-dot { width: 8px; height: 8px; background: rgba(255,255,255,0.3); border-radius: 50%; animation: sb 1.2s infinite; }
      .splash-dot:nth-child(2) { animation-delay: 0.2s; }
      .splash-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes sb { 0%,80%,100%{transform:translateY(0);background:rgba(255,255,255,0.3)} 40%{transform:translateY(-8px);background:rgba(255,255,255,0.9)} }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-logo">FinPath<span>.</span></div>
      <div class="splash-sub">Nigeria</div>
      <div class="splash-dots">
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
      </div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      window.__hideSplash = function() {
        var s = document.getElementById('splash');
        if (s) { s.classList.add('hidden'); setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 500); }
      };
    </script>
  </body>
</html>
